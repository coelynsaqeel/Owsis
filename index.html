<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>GlowUp — Book Local Services</title>
<style>
/* ==========================================================
   GlowUp — dark / gold booking app theme
   ========================================================== */

:root {
  --bg: #0e0e0e;
  --surface: #1a1a1a;
  --surface-2: #232323;
  --surface-3: #2b2b2b;
  --gold: #f5b400;
  --gold-dark: #d99e00;
  --text: #ffffff;
  --text-dim: #a8a8a8;
  --text-faint: #7a7a7a;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  font-size: 16px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: var(--text);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

a { color: inherit; text-decoration: none; }

img { display: block; max-width: 100%; }

/* Phone frame — centers app on desktop, full width on mobile */
.phone {
  max-width: 430px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
}

.screen {
  display: none;
  padding: 20px 20px 0;
  animation: fadeIn 0.25s ease;
}
.screen.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--gold);
}

.location-row {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--gold);
  font-weight: 600;
}

.chevron { color: var(--gold); font-size: 0.7rem; }

.welcome {
  font-size: 1rem;
  color: var(--text-dim);
  margin-top: 2px;
}
.welcome strong { color: var(--text); }

.bell-btn {
  position: relative;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

.bell-btn .dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  background: var(--gold);
  border-radius: 50%;
  border: 2px solid var(--surface-2);
}

/* ---------- Search ---------- */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  padding: 14px 18px;
  margin-bottom: 18px;
}

.search-icon { opacity: 0.6; }

.search-bar input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.95rem;
}
.search-bar input::placeholder { color: var(--text-faint); }

/* ---------- Promo banner ---------- */
.promo-banner {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-2);
  display: flex;
  align-items: stretch;
  min-height: 190px;
  margin-bottom: 26px;
}

.promo-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  mask-image: linear-gradient(to right, transparent 0%, transparent 38%, black 62%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 38%, black 62%);
}

.promo-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(20,20,20,0.96) 40%, rgba(20,20,20,0.15) 100%);
  pointer-events: none;
}

.promo-text {
  position: relative;
  z-index: 1;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  max-width: 65%;
}

.promo-badge {
  display: inline-block;
  background: rgba(245, 180, 0, 0.18);
  color: var(--gold);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  width: fit-content;
}

.promo-text h2 {
  margin: 0;
  font-size: 1.5rem;
  line-height: 1.2;
  font-weight: 800;
}

.btn-primary {
  background: var(--gold);
  color: #171200;
  font-weight: 700;
  border-radius: var(--radius-pill);
  padding: 12px 20px;
  font-size: 0.9rem;
  width: fit-content;
  box-shadow: 0 6px 18px rgba(245, 180, 0, 0.25);
}
.btn-primary:active { background: var(--gold-dark); }
.btn-small { padding: 10px 18px; font-size: 0.85rem; }

/* ---------- Sections ---------- */
.section { margin-bottom: 26px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-head h3 {
  margin: 0;
  font-size: 1.2rem;
  font-weight: 800;
}

.see-all {
  color: var(--gold);
  font-size: 0.85rem;
  font-weight: 600;
}

/* ---------- Categories ---------- */
.category-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.category-row::-webkit-scrollbar { display: none; }

.category-pill {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 76px;
  padding: 16px 8px;
  border-radius: var(--radius-md);
  background: var(--surface-2);
  color: var(--text-dim);
  font-size: 0.78rem;
  font-weight: 600;
}

.category-pill.active {
  background: var(--gold);
  color: #171200;
}

.cat-icon { font-size: 1.3rem; }

.cat-icon-all { font-size: 1.3rem; }

.cat-icon-img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  overflow: hidden;
  display: block;
  border: 2px solid transparent;
}
.cat-icon-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.category-pill.active .cat-icon-img {
  border-color: #171200;
}

/* ---------- Category subcategory view ---------- */
.subcat-section {
  margin-bottom: 26px;
}

.subcat-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.subcat-tab {
  background: var(--surface-2);
  color: var(--gold);
  font-weight: 800;
  font-size: 0.95rem;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(245, 180, 0, 0.35);
}

.subcat-count {
  color: var(--text-faint);
  font-size: 0.75rem;
}

.subcat-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}
.subcat-scroll::-webkit-scrollbar { display: none; }

.subcat-card {
  flex: 0 0 auto;
  width: 150px;
  text-align: left;
}

.subcat-img-wrap {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  height: 130px;
}
.subcat-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.subcat-card .rating-chip {
  padding: 4px 8px;
  font-size: 0.68rem;
}

.subcat-name {
  font-size: 0.82rem;
  font-weight: 700;
  margin-top: 8px;
  line-height: 1.25;
}
.subcat-price {
  font-size: 0.75rem;
  color: var(--gold);
  font-weight: 700;
  margin-top: 2px;
}

.category-empty {
  text-align: center;
  color: var(--text-faint);
  padding: 40px 0;
  font-size: 0.9rem;
}

/* ---------- Best Providers (horizontal image cards) ---------- */
.provider-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.provider-scroll::-webkit-scrollbar { display: none; }

.provider-card {
  flex: 0 0 auto;
  width: 62%;
  min-width: 210px;
}

.provider-img-wrap {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  height: 150px;
}

.provider-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rating-chip {
  position: absolute;
  top: 10px;
  left: 10px;
  background: var(--gold);
  color: #171200;
  font-weight: 700;
  font-size: 0.78rem;
  padding: 5px 10px;
  border-radius: var(--radius-pill);
}

.bookmark {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.55);
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
}

/* ---------- Featured providers (large overlay cards) ---------- */
.featured-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.featured-scroll::-webkit-scrollbar { display: none; }

.featured-card {
  position: relative;
  flex: 0 0 auto;
  width: 78%;
  min-width: 250px;
  height: 190px;
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.featured-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.featured-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 14px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 10%, transparent 60%);
}

.featured-name {
  font-weight: 800;
  font-size: 1.05rem;
}
.featured-loc {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 4px;
}

.arrow-btn {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--gold);
  color: #171200;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.arrow-btn.small { width: 28px; height: 28px; font-size: 0.85rem; }

/* ---------- Special offers ---------- */
.offers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.offer-card {
  background: var(--surface-2);
  border-radius: var(--radius-lg);
  overflow: hidden;
  text-align: left;
}

.offer-img-wrap {
  position: relative;
  height: 110px;
}
.offer-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.offer-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--gold);
  color: #171200;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 5px 9px;
  border-radius: var(--radius-pill);
}

.offer-body {
  padding: 10px 12px 14px;
  position: relative;
}

.offer-name { font-weight: 700; font-size: 0.9rem; }
.offer-sub { font-size: 0.72rem; color: var(--text-faint); margin-top: 2px; }

.offer-body .arrow-btn {
  position: absolute;
  right: 10px;
  bottom: 12px;
}

.bottom-spacer { height: 30px; }

/* ============ DETAIL SCREEN ============ */
#detail-screen { padding: 0 0 100px 0; }

.detail-hero {
  position: relative;
  height: 260px;
}
.detail-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

.status-chip {
  position: absolute;
  top: 22px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 0.78rem;
  font-weight: 700;
}
.status-chip.available {
  left: 72px;
  background: #1fae5c;
  color: #fff;
}
.status-chip.role {
  right: 20px;
  background: var(--gold);
  color: #171200;
}

.detail-body { padding: 20px; }

.detail-title-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.detail-title-row h2 {
  margin: 0 0 6px;
  font-size: 1.35rem;
  font-weight: 800;
}

.detail-loc {
  color: var(--text-dim);
  font-size: 0.85rem;
}

.rating-box {
  background: var(--surface-2);
  border: 1px solid rgba(245,180,0,0.3);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  text-align: center;
  flex: 0 0 auto;
}
.rating-star { color: var(--gold); font-weight: 800; }
.rating-count { font-size: 0.68rem; color: var(--text-faint); margin-top: 2px; }

.distance-chip {
  display: inline-block;
  margin-top: 14px;
  background: var(--surface-2);
  color: var(--text-dim);
  font-size: 0.78rem;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
}

.tab-row {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  padding: 6px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text-dim);
}
.tab.active {
  background: var(--gold);
  color: #171200;
}

.services-list {
  margin-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.service-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  padding: 16px 18px;
}

.service-name { font-weight: 700; font-size: 0.98rem; }
.service-duration { color: var(--text-faint); font-size: 0.78rem; margin-top: 3px; }
.service-price { color: var(--gold); font-weight: 800; font-size: 1rem; }

.book-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 22px;
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

.starting-label { font-size: 0.72rem; color: var(--text-faint); }
.starting-price { font-size: 1.3rem; font-weight: 800; color: var(--text); }

.book-btn { padding: 14px 34px; font-size: 0.95rem; }

/* ---------- Responsive ---------- */
@media (min-width: 431px) {
  .phone {
    margin-top: 24px;
    margin-bottom: 24px;
    border-radius: 36px;
    border: 8px solid #1c1c1c;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    min-height: auto;
  }
  .book-bar { border-radius: 0 0 28px 28px; }
}

</style>
</head>

const backBtn = document.getElementById("back-btn");
const allView = document.getElementById("all-view");
const categoryView = document.getElementById("category-view");

let currentProviderData = null;

function renderDetail(data) {
  currentProviderData = data;

  document.getElementById("detail-hero-img").src = data.heroImg;
  document.getElementById("detail-name").textContent = data.name;
  document.getElementById("detail-address").textContent = data.address;
  document.getElementById("detail-rating").textContent = data.rating;
  document.getElementById("detail-reviews").textContent = data.reviews;
  document.getElementById("detail-distance").textContent = data.distance;
  document.getElementById("detail-price").textContent = data.services[0].price;

  const list = document.getElementById("services-list");
  list.innerHTML = "";
  data.services.forEach((s) => {
    const row = document.createElement("div");
    row.className = "service-row";
    row.innerHTML = `
      <div>
        <div class="service-name">${s.name}</div>
        <div class="service-duration">${s.duration}</div>
      </div>
      <div class="service-price">$${s.price}</div>
    `;
    list.appendChild(row);
  });

  // reset tabs to "Services"
  document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
  document.querySelector('.tab[data-tab="services"]').classList.add("active");

  homeScreen.classList.remove("active");
  detailScreen.classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" });
}

function openProvider(id) {
  const data = PROVIDERS[id];
  if (data) renderDetail(data);
}

function goHome() {
  detailScreen.classList.remove("active");
  homeScreen.classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.querySelectorAll("[data-provider]").forEach((el) => {
  el.addEventListener("click", () => openProvider(el.dataset.provider));
});

backBtn.addEventListener("click", goHome);

// Tabs on detail screen (Services / Reviews) — Reviews is a stub for now
document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    const list = document.getElementById("services-list");
    if (tab.dataset.tab === "reviews") {
      list.innerHTML = `<div style="color:var(--text-faint); text-align:center; padding:30px 0;">Reviews coming soon.</div>`;
    } else if (currentProviderData) {
      renderDetail(currentProviderData);
    }
  });
});

// ---------- Category selection: render subcategory feed ----------

function buildSubcatCard(place) {
  const card = document.createElement("button");
  card.className = "subcat-card";
  card.innerHTML = `
    <div class="subcat-img-wrap">
      <img src="${place.heroImg}" alt="${place.name}" />
      <span class="rating-chip">★ ${place.rating}</span>
    </div>
    <div class="subcat-name">${place.name}</div>
    <div class="subcat-price">From $${place.price}</div>
  `;
  card.addEventListener("click", () => renderDetail(place));
  return card;
}

function renderCategory(categoryKey) {
  categoryView.innerHTML = "";

  if (categoryKey === "all") {
    allView.style.display = "";
    categoryView.style.display = "none";
    return;
  }

  allView.style.display = "none";
  categoryView.style.display = "";

  const category = CATEGORY_DATA[categoryKey];
  if (!category) {
    categoryView.innerHTML = `<div class="category-empty">No listings yet in this category.</div>`;
    return;
  }

  Object.entries(category.subcategories).forEach(([subName, places]) => {
    const section = document.createElement("section");
    section.className = "subcat-section";

    const head = document.createElement("div");
    head.className = "subcat-head";
    head.innerHTML = `
      <span class="subcat-tab">${subName}</span>
      <span class="subcat-count">${places.length} ${places.length === 1 ? "place" : "places"}</span>
    `;
    section.appendChild(head);

    const scroll = document.createElement("div");
    scroll.className = "subcat-scroll";
    places.forEach((place) => scroll.appendChild(buildSubcatCard(place)));
    section.appendChild(scroll);

    categoryView.appendChild(section);
  });
}

// Category pill selection state
document.querySelectorAll(".category-pill").forEach((pill) => {
  pill.addEventListener("click", () => {
    document.querySelectorAll(".category-pill").forEach((p) => p.classList.remove("active"));
    pill.classList.add("active");
    renderCategory(pill.dataset.category);
  });
});
